<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F2A5C"/>
      <stop offset="100%" stop-color="#091E45"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0C56A"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Cruz estilizada -->
  <g transform="translate(10 8)">
    <rect x="14" y="0" width="6" height="48" rx="1" fill="url(#gold)"/>
    <rect x="0" y="14" width="34" height="6" rx="1" fill="url(#gold)"/>
  </g>
  <!-- Letra R -->
  <text x="32" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="bold" text-anchor="middle" fill="#FFFFFF">R</text>
</svg>
